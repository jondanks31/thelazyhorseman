<!-- Supabase → Authentication → Emails → Confirm signup.
     Paste the whole file into the Message body.

     Same paper-on-brown shell as booking/lib/notices.ts, written out
     rather than shared, because Supabase renders this and the app never
     sees it. If the look changes there, change it here too. -->
<body style="margin:0;padding:0;width:100%;background:#3C2E22;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Confirm your email and your yard is next.</div>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#3C2E22;">
<tr><td align="center" style="padding:32px 14px 44px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;">
  <tr><td style="padding:0 8px 16px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#BCAE9B;">
    The Lazy Horseman
  </td></tr>
  <tr><td style="background:#F4F1E9;border:3px solid #3C2E22;border-radius:30px 11px 32px 12px;padding:30px 28px;">

    <h1 style="margin:0 0 16px;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:26px;line-height:1.15;letter-spacing:-.02em;font-weight:800;color:#3C2E22;">
      Right, that is your email.
    </h1>

    <p style="margin:0 0 20px;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#33291F;">
      Confirm it and you can carry on setting the yard up.
    </p>

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:2px 0 8px;"><tr>
      <td style="background:#7ED957;border:3px solid #3C2E22;border-radius:22px 8px 24px 9px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 24px;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;color:#3C2E22;text-decoration:none;">Confirm my email</a>
      </td>
    </tr></table>

    <p style="margin:0;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12px;line-height:1.5;word-break:break-all;color:#5B4E40;">
      <a href="{{ .ConfirmationURL }}" style="color:#5B4E40;">{{ .ConfirmationURL }}</a>
    </p>

    <p style="margin:18px 0 0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:#5B4E40;">
      If you did not ask for this, ignore it and nothing happens.
    </p>

  </td></tr>
  <tr><td style="padding:18px 8px 0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#BCAE9B;">
    Arena booking, from The Lazy Horseman.
  </td></tr>
</table>
</td></tr>
</table>
</body>
